name: test-managed-permissions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-acl:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go test -v ./internal/restrictedfile
