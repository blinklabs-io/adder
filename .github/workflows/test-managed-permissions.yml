name: test-managed-permissions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-acl:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go test -v ./internal/restrictedfile
