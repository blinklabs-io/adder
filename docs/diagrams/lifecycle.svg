<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" role="img" lang="en" aria-labelledby="diagram-title diagram-description" width="1560" height="960">
  <title id="diagram-title">Managed pipeline lifecycle</title>
  <desc id="diagram-description">Sequence diagram showing outputs, reverse filters, then inputs starting; forwarding joins before inputs, filters, and outputs stop in reverse startup order.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#1971c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#2b8a3e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M1,1 L10,5 L1,9" fill="none" stroke="#d9480f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="68" font-family="Virgil, Comic Sans MS, cursive" font-size="36" font-weight="700" text-anchor="start" fill="#1e1e1e">Managed pipeline lifecycle</text>
  <text x="60" y="108" font-family="Virgil, Comic Sans MS, cursive" font-size="20" font-weight="400" text-anchor="start" fill="#868e96">Consumers are ready before producers; shutdown reverses recorded startup order.</text>
  <rect x="45" y="245" width="1470" height="285" rx="16" fill="#ebfbee" fill-opacity="0.45"/>
  <rect x="30.0" y="135" width="220" height="82" rx="10" fill="#f1f3f5" fill-opacity="1.0" stroke="#868e96" stroke-width="2" filter="url(#paper-shadow)"/>
  <text x="140" y="167" font-family="Virgil, Comic Sans MS, cursive" font-size="24" font-weight="600" text-anchor="middle" fill="#1e1e1e">Owner</text>
  <text x="140" y="197" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="400" text-anchor="middle" fill="#868e96">CLI / Go caller</text>
  <path d="M140 229 L140 880" fill="none" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="9 8"/>
  <rect x="340.0" y="135" width="220" height="82" rx="10" fill="#e7f5ff" fill-opacity="1.0" stroke="#1971c2" stroke-width="2" filter="url(#paper-shadow)"/>
  <text x="450" y="167" font-family="Virgil, Comic Sans MS, cursive" font-size="24" font-weight="600" text-anchor="middle" fill="#1e1e1e">Pipeline</text>
  <text x="450" y="197" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="400" text-anchor="middle" fill="#868e96">lifecycle owner</text>
  <path d="M450 229 L450 880" fill="none" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="9 8"/>
  <rect x="650.0" y="135" width="220" height="82" rx="10" fill="#ebfbee" fill-opacity="1.0" stroke="#2b8a3e" stroke-width="2" filter="url(#paper-shadow)"/>
  <text x="760" y="167" font-family="Virgil, Comic Sans MS, cursive" font-size="24" font-weight="600" text-anchor="middle" fill="#1e1e1e">Outputs</text>
  <text x="760" y="197" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="400" text-anchor="middle" fill="#868e96">sinks</text>
  <path d="M760 229 L760 880" fill="none" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="9 8"/>
  <rect x="960.0" y="135" width="220" height="82" rx="10" fill="#ebfbee" fill-opacity="1.0" stroke="#2b8a3e" stroke-width="2" filter="url(#paper-shadow)"/>
  <text x="1070" y="167" font-family="Virgil, Comic Sans MS, cursive" font-size="24" font-weight="600" text-anchor="middle" fill="#1e1e1e">Filters</text>
  <text x="1070" y="197" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="400" text-anchor="middle" fill="#868e96">ordered chain</text>
  <path d="M1070 229 L1070 880" fill="none" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="9 8"/>
  <rect x="1270.0" y="135" width="220" height="82" rx="10" fill="#ebfbee" fill-opacity="1.0" stroke="#2b8a3e" stroke-width="2" filter="url(#paper-shadow)"/>
  <text x="1380" y="167" font-family="Virgil, Comic Sans MS, cursive" font-size="24" font-weight="600" text-anchor="middle" fill="#1e1e1e">Inputs</text>
  <text x="1380" y="197" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="400" text-anchor="middle" fill="#868e96">selected sources</text>
  <path d="M1380 229 L1380 880" fill="none" stroke="#868e96" stroke-width="1" stroke-linecap="round" stroke-dasharray="9 8"/>
  <text x="65" y="280" font-family="Virgil, Comic Sans MS, cursive" font-size="20" font-weight="700" text-anchor="start" fill="#2b8a3e">STARTUP</text>
  <path d="M150 300 L440 300" fill="none" stroke="#1971c2" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <rect x="173.9" y="271" width="242.2" height="25" rx="5" fill="#ffffff"/>
  <text x="295.0" y="290" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#1971c2">StartContext(ctx)</text>
  <path d="M460 350 L750 350" fill="none" stroke="#2b8a3e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="490.2" y="321" width="229.6" height="25" rx="5" fill="#ffffff"/>
  <text x="605.0" y="340" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#2b8a3e">1. Start outputs</text>
  <path d="M460 400 L1060 400" fill="none" stroke="#2b8a3e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="582.2" y="371" width="355.59999999999997" height="25" rx="5" fill="#ffffff"/>
  <text x="760.0" y="390" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#2b8a3e">2. Start filters · reverse</text>
  <path d="M460 450 L1370 450" fill="none" stroke="#2b8a3e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="806.5" y="421" width="217.0" height="25" rx="5" fill="#ffffff"/>
  <text x="915.0" y="440" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#2b8a3e">3. Start inputs</text>
  <path d="M440 500 L150 500" fill="none" stroke="#868e96" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow-ink)"/>
  <rect x="236.9" y="471" width="116.19999999999999" height="25" rx="5" fill="#ffffff"/>
  <text x="295.0" y="490" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#868e96">running</text>
  <rect x="45" y="545" width="1470" height="305" rx="16" fill="#fff4e6" fill-opacity="0.55"/>
  <text x="65" y="580" font-family="Virgil, Comic Sans MS, cursive" font-size="20" font-weight="700" text-anchor="start" fill="#d9480f">SHUTDOWN</text>
  <path d="M150 620 L440 620" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="85.70000000000002" y="591" width="418.59999999999997" height="25" rx="5" fill="#ffffff"/>
  <text x="295.0" y="610" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#d9480f">Stop · cancel + join forwarding</text>
  <path d="M460 670 L1370 670" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="749.8" y="641" width="330.4" height="25" rx="5" fill="#ffffff"/>
  <text x="915.0" y="660" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#d9480f">4. Stop inputs · reverse</text>
  <path d="M460 720 L1060 720" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="588.5" y="691" width="343.0" height="25" rx="5" fill="#ffffff"/>
  <text x="760.0" y="710" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#d9480f">5. Stop filters · forward</text>
  <path d="M460 770 L750 770" fill="none" stroke="#d9480f" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="433.5" y="741" width="343.0" height="25" rx="5" fill="#ffffff"/>
  <text x="605.0" y="760" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#d9480f">6. Stop outputs · reverse</text>
  <path d="M440 830 L150 830" fill="none" stroke="#868e96" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 8" marker-end="url(#arrow-ink)"/>
  <rect x="186.5" y="801" width="217.0" height="25" rx="5" fill="#ffffff"/>
  <text x="295.0" y="820" font-family="Virgil, Comic Sans MS, cursive" font-size="18" font-weight="500" text-anchor="middle" fill="#868e96">channels closed</text>
</svg>
